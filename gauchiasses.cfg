# Réglages de gauchiasses.fr (format INI). Un seul fichier pour le site, la veille et le serveur.
# Lu par le paquet Python gauchiasses/ (gauchiasses/config.py) et par les scripts de deploy/ (deploy/lib_config.sh).
# Après une modification : reconstruire (bin/build_site.py --simple), puis publier.

[site]
domaine = gauchiasses.fr
# Nom du site, annoncé par le KiosKe quand on partage son lien (balise og:site_name).
# La page principale (accueil/index.html) est écrite à la main : son titre se change dans ce fichier-là.
nom = Mélenchon 2027

[veille]
# Nom de la page de veille (veille.html) : titre de l'onglet, des flux RSS et du partage.
nom = KiosKe
# Phrase d'accroche : sert au titre de l'onglet et aux moteurs de recherche.
slogan = veille des médias indépendants, des luttes et des voix LGBTQIA+
# Thème affiché par défaut sur le KiosKe (une des sections [theme.<nom>] ci-dessous).
theme = pluie
# Nombre d'articles dans chaque flux RSS produit (rss.xml et rss/<catégorie>.xml).
articles_flux_rss = 100
# Nombre de vidéos regardées par chaîne Twitch (un appel réseau par vidéo).
videos_par_chaine = 15
# Nombre d'articles affichés par source, les plus récents d'abord. 0 = tous (la base n'est jamais purgée).
articles_par_source = 0
# Une image ou un aperçu en échec est réessayé après ce délai.
delai_nouvel_essai_heures = 24

[cartes]
# Page principale : réglages du build des cartes (bin/construire_cartes.py), qui tourne sur le PC.
# Période du passage au rouge des étiquettes du nuage, en secondes.
periode_etiquettes = 5
# Police des titres : demande le fichier static/fonts/<nom-en-minuscules-avec-tirets>.woff2.
police = Russo One

[serveur]
# Dossier servi par nginx : la publication y copie le contenu de build/.
racine_web = /var/www/gauchiasses.fr
# IP publique attendue pour le domaine (contrôle de deploy/verifier_serveur.sh).
ip_publique = 86.238.75.39
# Fréquence du timer systemd gauchiasses-veille (format systemd : 30min, 1h…). Relancer deploy/installer_serveur.sh après un changement.
intervalle_timer = 30min

# Un thème du KiosKe = une section [theme.<nom>]. Le visiteur choisit parmi tous les thèmes listés ici
# (avec un seul thème, aucun bouton de choix n'est affiché).
#   fond            : etoiles (nuit étoilée, bande de la Voie lactée) | noir
#   pluie           : oui | non (pluie matricielle, CSS pur)
#   opacite_panneau : opacité du fond du grand panneau principal, en % (0 = transparent, 100 = opaque)

[theme.pluie]
nom = Pluie matricielle
fond = noir
pluie = oui
opacite_panneau = 100

[theme.voie_lactee]
nom = Voie lactée (nuit étoilée)
fond = etoiles
pluie = non
opacite_panneau = 45

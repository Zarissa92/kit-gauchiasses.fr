# Filtre fail2ban : scans du site gauchiasses.fr (fichiers cachés, PHP, pages d'administration inexistantes).
# Lit le journal nginx au format « combined ». Test avant installation :
#   sudo fail2ban-regex /var/log/nginx/gauchiasses.fr.access.log /chemin/vers/gauchiasses-scan.conf
# Les demandes de /.well-known/ (Let's Encrypt) ne comptent pas.

[Definition]

failregex = ^<HOST> \S+ \S+ \[[^\]]+\] "(?:GET|POST|HEAD|PUT|DELETE|OPTIONS|PROPFIND|TRACE|CONNECT) [^"]*(?:/\.(?!well-known/)|\.(?:php\d?|asp|aspx|jsp|cgi)\b|/wp-(?:login|admin|content|includes)|/xmlrpc\.php|/phpmyadmin|/cgi-bin/)[^"]*" (?:400|403|404|405|444)\b

ignoreregex =

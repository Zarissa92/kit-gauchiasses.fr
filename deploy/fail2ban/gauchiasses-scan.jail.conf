# Jail fail2ban de gauchiasses.fr : une IP qui sonde le site (voir gauchiasses-scan.conf) est bannie.
# Le ban est appliqué par nginx (action nginx-geo-ban, installée par f2b.sh) : page « Tu es banni ».
# Installé par deploy/gauchiasses.sh fail2ban, dans /etc/fail2ban/jail.d/gauchiasses-scan.local.
# __DOMAINE__ est remplacé à l'installation par le domaine de gauchiasses.cfg.

[gauchiasses-scan]
enabled   = true
port      = http,https
filter    = gauchiasses-scan
logpath   = /var/log/nginx/__DOMAINE__.access.log
maxretry  = 5
findtime  = 10m
bantime   = 1d
banaction = nginx-geo-ban

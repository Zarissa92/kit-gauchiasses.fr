# Référence pour nginx sur le serveur : À RELIRE ET APPLIQUER À LA MAIN.
# Copier dans /etc/nginx/sites-available/gauchiasses.fr, puis :
#   sudo ln -s /etc/nginx/sites-available/gauchiasses.fr /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# La racine web est public/ : seuls index.html, favicon.svg et veille/ y sont copiés.
# bin/, data/, deploy/ et les fichiers de flux restent hors de la racine servie.

server {
    listen 80;
    listen [::]:80;
    server_name gauchiasses.fr www.gauchiasses.fr;

    # Renouvellement Let's Encrypt
    # ^~ : prioritaire sur la règle des fichiers cachés (regex), sinon Let's Encrypt échoue
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://gauchiasses.fr$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name gauchiasses.fr;

    # Certificat Let's Encrypt (chemins standard de certbot, à adapter si besoin)
    ssl_certificate     /etc/letsencrypt/live/gauchiasses.fr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/gauchiasses.fr/privkey.pem;

    root /home/meli/gauchiasses.fr/public;
    index index.html;

    # Fichiers en pointillés ou cachés (.git, .env, .directory…) : jamais servis
    location ~ /\. {
        deny all;
        return 404;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    # Les pages du site sont statiques : pas de cache long pour la veille
    location /veille/ {
        add_header Cache-Control "no-cache";
    }

    access_log /var/log/nginx/gauchiasses.access.log;
    error_log  /var/log/nginx/gauchiasses.error.log;
}
